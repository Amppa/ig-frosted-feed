<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frosted Feed - Settings</title>
  <link rel="stylesheet" href="options.css">
</head>

<body>
  <div class="container">
    <header class="header">
      <div class="brand">
        <div class="logo-badge">FF</div>
        <div>
          <h1 class="title">Frosted Feed Settings</h1>
          <p class="subtitle">Customize overlay appearance and blur</p>
        </div>
      </div>
      <button class="reset-btn" id="resetDefaultsBtn">Reset to Defaults</button>
    </header>

    <div class="main-layout">
      <!-- Settings Section -->
      <section class="settings-card">
        <h2 class="section-title">Overlay Appearance</h2>

        <!-- Mask Color -->
        <div class="control-group">
          <div class="control-label-wrap">
            <span class="control-label">Mask Color</span>
            <span class="control-desc">Base background tone for the overlay</span>
          </div>
          <div class="color-picker-wrap">
            <input type="color" id="maskColor" value="#000000">
            <span class="color-code" id="maskColorCode">#000000</span>
          </div>
        </div>

        <!-- Mask Opacity (min 0%) -->
        <div class="control-group">
          <div class="control-label-wrap">
            <span class="control-label">Mask Opacity</span>
            <span class="control-desc">0%: transparent, 100%: solid</span>
          </div>
          <div class="slider-wrap">
            <input type="range" id="maskOpacity" min="0" max="100" step="5" value="50">
            <span class="slider-val" id="maskOpacityVal">50%</span>
          </div>
        </div>

        <!-- Backdrop Blur -->
        <div class="control-group">
          <div class="control-label-wrap">
            <span class="control-label">Backdrop Blur</span>
            <span class="control-desc">Soft frosted glass effect</span>
          </div>
          <div class="slider-wrap">
            <input type="range" id="maskBlur" min="0" max="20" value="5">
            <span class="slider-val" id="maskBlurVal">5px</span>
          </div>
        </div>

        <div class="divider"></div>

        <h2 class="section-title">Diagnostics</h2>

        <!-- Debug Log -->
        <div class="control-group switch-row">
          <div class="control-label-wrap">
            <span class="control-label">Console Log</span>
            <span class="control-desc">Print detailed logs in F12</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="debugLog">
            <span class="slider round"></span>
          </label>
        </div>
      </section>
    </div>
  </div>
  <script src="../shared/defaults.js"></script>
  <script src="options.js"></script>
</body>

</html>
